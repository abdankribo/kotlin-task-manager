<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow</title><style>:root{--a:#ec4899}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select,textarea{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}pre{color:#bfc8d5;white-space:pre-wrap}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Taskflow<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Board</a><a href="?view=1">Calendar</a><a href="?view=2">Insights</a><a href="?view=3">Completed</a></nav></header><main id="app"></main><script>let tasks=JSON.parse(localStorage.tasks||'[{"id":1,"title":"Finish portfolio","priority":"High","done":false},{"id":2,"title":"Review Kotlin code","priority":"Medium","done":true}]');function save(){localStorage.tasks=JSON.stringify(tasks)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);let open=tasks.filter(x=>!x.done),done=tasks.filter(x=>x.done);app.innerHTML=v===0?'<h1>Ship the portfolio.</h1><form onsubmit="return addT(event)"><input id="title" placeholder="Task" required><select id="priority"><option>High</option><option>Medium</option><option>Low</option></select><button>Add task</button></form><div class="grid"><div><small>ALL</small><b>'+tasks.length+'</b></div><div><small>OPEN</small><b>'+open.length+'</b></div><div><small>DONE</small><b>'+done.length+'</b></div></div>'+list(open):v===1?'<h1>Calendar</h1>'+list(tasks):v===2?'<h1>Insights</h1><div class="grid"><div><small>COMPLETION</small><b>'+Math.round(done.length/(tasks.length||1)*100)+'%</b></div><div><small>HIGH PRIORITY</small><b>'+tasks.filter(x=>x.priority==='High'&&!x.done).length+'</b></div></div><div class="chart">'+tasks.map(x=>'<i style="height:'+(x.done?90:35)+'%"></i>').join('')+'</div>':'<h1>Completed</h1>'+list(done)}function list(a){return '<section class="list">'+a.map(x=>'<div><span>'+x.title+' · '+x.priority+'</span><span><button onclick="toggleT('+x.id+')">'+(x.done?'Undo':'Complete')+'</button><button onclick="delT('+x.id+')">×</button></span></div>').join('')+'</section>'}function addT(e){e.preventDefault();tasks.push({id:Date.now(),title:title.value,priority:priority.value,done:false});save();render();return false}function toggleT(id){let x=tasks.find(x=>x.id===id);x.done=!x.done;save();render()}function delT(id){tasks=tasks.filter(x=>x.id!==id);save();render()}render();</script></body></html>
